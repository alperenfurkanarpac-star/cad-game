<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>AutoCAD & SketchUp Bilgi Yarışması</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--line:#354762;--text:#f2f6ff;--muted:#bdc9dc;--blue:#72a7ff;--cyan:#53d5e8;--green:#43d69a;--red:#ff7777}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(10px,3vw,28px);display:grid;place-items:center;background:radial-gradient(ellipse at top,#243956,var(--bg) 62%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
    button{font:inherit;color:inherit;touch-action:manipulation}.app{width:min(100%,760px);overflow:hidden;background:rgba(22,33,51,.97);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 65px #0007}.header{padding:16px clamp(16px,4vw,28px);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#121d2e}.header h1{font-size:clamp(1.15rem,4vw,1.8rem);margin:0}.tag{font-size:.75rem;font-weight:800;letter-spacing:.06em;color:#081321;background:linear-gradient(100deg,var(--blue),var(--cyan));padding:8px 12px;border-radius:99px;white-space:nowrap}.screen{display:none;padding:clamp(16px,4vw,30px)}.screen.active{display:block}.lead{color:var(--muted);line-height:1.6;margin:0 0 20px}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{min-height:145px;padding:22px;background:linear-gradient(145deg,#243550,#1b273b);border:1px solid var(--line);border-radius:16px;text-align:left;cursor:pointer}.tile:hover,.tile:focus-visible{border-color:var(--blue)}.tile b{display:block;font-size:1.25rem;margin:9px 0}.tile span{color:var(--muted);line-height:1.5}.icon{font-size:1.8rem}.btn{border:1px solid var(--line);background:#223149;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--blue);background:#2b3c58}.primary{width:100%;margin-top:16px;border:0;color:#091322;background:linear-gradient(100deg,var(--blue),var(--cyan));font-weight:850}.back{width:100%;margin-top:14px;background:transparent}.categories{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.categories .btn{flex:1;min-width:100px}.selected{border-color:var(--blue);background:#2b4263}.stats{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.95rem;margin-bottom:12px}.track{height:8px;border-radius:20px;background:#29364b;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}.question{font-size:clamp(1.15rem,3.8vw,1.7rem);line-height:1.4;margin:22px 0 16px}.answers{display:grid;gap:10px}.answer{text-align:left}.answer.correct{border-color:var(--green);background:#163d34}.answer.wrong{border-color:var(--red);background:#452a35}.answer:disabled{opacity:1}.feedback{min-height:26px;font-weight:700;margin:14px 0 0}.good{color:var(--green)}.bad{color:var(--red)}.result{text-align:center;padding:18px;background:#202e44;border-radius:16px;color:var(--muted);line-height:1.6}.result strong{display:block;color:white;font-size:2rem;margin-bottom:8px}
    .confetti-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:9999}.confetti-burst{position:absolute;left:var(--x);top:var(--y);animation:burst 1.8s cubic-bezier(.12,.7,.25,1) forwards;will-change:transform,opacity}.brand-chip{display:flex;align-items:center;gap:5px;padding:5px 8px 5px 5px;border:1px solid #ffffff99;border-radius:8px;background:var(--brand-bg);color:white;box-shadow:0 3px 12px #0007;font-size:clamp(10px,2.3vw,14px);font-weight:900;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#fff;color:var(--brand-color);font-size:15px;font-weight:950}.spark{position:absolute;width:9px;height:9px;border-radius:2px;background:var(--color);animation:sparkle 1.35s ease-out forwards}@keyframes burst{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.7) rotate(var(--rot))}}@keyframes sparkle{0%{opacity:0;transform:translate(0,0) scale(.2)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0) rotate(150deg)}}
    @media(max-width:600px){body{padding:8px;display:block}.app{margin:8px auto;border-radius:16px}.header{padding:13px 15px}.screen{padding:16px}.menu-grid{grid-template-columns:1fr}.tile{min-height:auto;padding:17px}.categories{gap:7px}.categories .btn{padding:11px 9px}}
    @media(prefers-reduced-motion:reduce){.confetti-burst,.spark{animation-duration:1s}}
  </style>
</head>
<body>
<main class="app">
  <header class="header"><h1>CAD Bilgi Yarışması</h1><span class="tag">AutoCAD • SketchUp</span></header>
  <section id="home" class="screen active">
    <p class="lead">AutoCAD ve SketchUp komutları hakkındaki bilgini test et. Kategori seç, soruları cevapla ve puanını gör!</p>
    <div class="menu-grid">
      <button class="tile" id="openQuiz"><span class="icon">🧠</span><b>Komut Bilgi Yarışması</b><span>Doğru cevaplarda AutoCAD ve SketchUp logolu konfeti patlar!</span></button>
      <button class="tile" id="quickStart"><span class="icon">🚀</span><b>Hemen Başla</b><span>Karışık sorularla yarışmaya hemen başla.</span></button>
    </div>
  </section>
  <section id="quiz" class="screen">
    <div class="stats"><span id="qCount"></span><span id="score">Puan: 0</span></div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="categories" aria-label="Soru kategorisi seç"><button class="btn selected" data-cat="all">Karışık</button><button class="btn" data-cat="AutoCAD">AutoCAD</button><button class="btn" data-cat="SketchUp">SketchUp</button></div>
    <h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p>
    <button class="btn primary hidden" id="next">Sonraki soru</button><button class="btn back" data-home>Ana menü</button>
  </section>
  <section id="result" class="screen"><h2>Yarışma tamamlandı</h2><div class="result" id="resultText"></div><button class="btn primary" id="replay">Tekrar oyna</button><button class="btn back" data-home>Ana menü</button></section>
</main>
<div class="confetti-layer" id="confetti" aria-hidden="true"></div>
<script>
const Q=[
 {c:'AutoCAD',q:'AutoCAD’de çizgi çizmek için kullanılan temel komut hangisidir?',a:['LINE','TRIM','OFFSET','FILLET'],x:'LINE'},
 {c:'AutoCAD',q:'Bir nesnenin kopyasını oluşturmak için hangi komut kullanılır?',a:['MOVE','COPY','ARRAY','ROTATE'],x:'COPY'},
 {c:'AutoCAD',q:'Fazla çizgi parçalarını kesmek için hangi komut kullanılır?',a:['TRIM','EXTEND','JOIN','BREAK'],x:'TRIM'},
 {c:'AutoCAD',q:'Daire çizmek için kullanılan komut hangisidir?',a:['CIRCLE','ARC','ELLIPSE','POLYGON'],x:'CIRCLE'},
 {c:'AutoCAD',q:'Nesneyi başka bir konuma taşımak için hangi komut kullanılır?',a:['MOVE','COPY','SCALE','ERASE'],x:'MOVE'},
 {c:'AutoCAD',q:'Nesneyi aynalamak için hangi komut kullanılır?',a:['MIRROR','OFFSET','ALIGN','STRETCH'],x:'MIRROR'},
 {c:'SketchUp',q:'Bir yüzeyi 3 boyutlu hale getirmek için hangi araç kullanılır?',a:['Push/Pull','Orbit','Paint Bucket','Eraser'],x:'Push/Pull'},
 {c:'SketchUp',q:'Modeli farklı açılardan incelemek için kullanılan araç hangisidir?',a:['Orbit','Line','Move','Scale'],x:'Orbit'},
 {c:'SketchUp',q:'SketchUp’ta dikdörtgen aracının varsayılan kısayolu hangisidir?',a:['R','L','M','P'],x:'R'},
 {c:'SketchUp',q:'Yüzeye renk veya malzeme uygulamak için hangi araç kullanılır?',a:['Paint Bucket','Select','Arc','Rotate'],x:'Paint Bucket'},
 {c:'SketchUp',q:'Bir nesneyi taşımak için hangi araç kullanılır?',a:['Move','Offset','Push/Pull','Zoom'],x:'Move'},
 {c:'SketchUp',q:'Çizgi çizmek için kullanılan araç hangisidir?',a:['Line','Circle','Rectangle','Orbit'],x:'Line'}
];
let category='all',list=[],index=0,points=0,locked=false;
const screens=[...document.querySelectorAll('.screen')];
function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id))}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('selected',x===b));startQuiz()});
document.getElementById('openQuiz').onclick=startQuiz;
document.getElementById('quickStart').onclick=()=>{category='all';document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('selected',x.dataset.cat==='all'));startQuiz()};
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));
function startQuiz(){list=shuffled(category==='all'?Q:Q.filter(q=>q.c===category));index=0;points=0;show('quiz');render()}
function render(){locked=false;const item=list[index];document.getElementById('qCount').textContent=`Soru ${index+1} / ${list.length} • ${item.c}`;document.getElementById('score').textContent=`Puan: ${points}`;document.getElementById('bar').style.width=`${index/list.length*100}%`;document.getElementById('question').textContent=item.q;const fb=document.getElementById('feedback');fb.textContent='';fb.className='feedback';const next=document.getElementById('next');next.classList.add('hidden');const box=document.getElementById('answers');box.replaceChildren();shuffled(item.a).forEach(answer=>{const b=document.createElement('button');b.className='btn answer';b.textContent=answer;b.onclick=()=>choose(b,answer,item.x);box.append(b)})}
function choose(btn,answer,correct){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct')});const fb=document.getElementById('feedback');if(answer===correct){points++;fb.textContent='Doğru cevap! Harika!';fb.classList.add('good');burstConfetti()}else{btn.classList.add('wrong');fb.textContent=`Yanlış. Doğru cevap: ${correct}`;fb.classList.add('bad')}document.getElementById('score').textContent=`Puan: ${points}`;const next=document.getElementById('next');next.textContent=index===list.length-1?'Sonucu gör':'Sonraki soru';next.classList.remove('hidden')}
function burstConfetti(){const layer=document.getElementById('confetti');const colors=['#e6292e','#ff6b5f','#f4f7ff','#f2bd43','#168b58','#37b878','#8ce0a7'];const brands=[{name:'AutoCAD',mark:'A',bg:'#d9262e',color:'#c91f26'},{name:'SketchUp',mark:'S',bg:'#168b58',color:'#117647'}];const count=innerWidth<600?20:34;const originX=innerWidth/2,originY=Math.max(100,innerHeight*.42);for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2;const distance=100+Math.random()*Math.min(innerWidth*.4,300);const piece=document.createElement('span');piece.className='confetti-burst';piece.style.setProperty('--x',`${originX}px`);piece.style.setProperty('--y',`${originY}px`);piece.style.setProperty('--dx',`${Math.cos(angle)*distance}px`);piece.style.setProperty('--dy',`${Math.sin(angle)*distance+70}px`);piece.style.setProperty('--rot',`${Math.random()*720-360}deg`);if(i%3===0){const brand=brands[(i/3|0)%brands.length];const chip=document.createElement('span');chip.className='brand-chip';chip.style.setProperty('--brand-bg',brand.bg);chip.style.setProperty('--brand-color',brand.color);const mark=document.createElement('span');mark.className='brand-mark';mark.textContent=brand.mark;chip.append(mark,document.createTextNode(brand.name));piece.append(chip)}else{piece.classList.add('spark');piece.style.setProperty('--color',colors[Math.random()*colors.length|0]);piece.style.setProperty('--dx',`${Math.cos(angle)*distance*.8}px`);piece.style.setProperty('--dy',`${Math.sin(angle)*distance*.8+60}px`)}layer.append(piece);piece.addEventListener('animationend',()=>piece.remove(),{once:true})}}
document.getElementById('next').onclick=()=>{if(++index<list.length)render();else{show('result');const r=points/list.length;document.getElementById('resultText').innerHTML=`<strong>${points} / ${list.length} doğru</strong>${r===1?'Harika! Hepsini doğru bildin.':r>=.7?'Çok iyi!':r>=.4?'İyi gidiyorsun, devam et!':'Bir tur daha oynayıp bilgini pekiştir.'}`}};
document.getElementById('replay').onclick=startQuiz;
</script>
</body>
</html>
