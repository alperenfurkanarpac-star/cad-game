<html lang="tr">
<head>

  <style>
    :root{color-scheme:dark;--bg:#0b1220;--panel:#111c2b;--line:#2f4665;--text:#edf5ff;--muted:#bfd2eb;--blue:#72a7ff;--cyan:#5fe4ff;--green:#53d7a3;--red:#ff7a7a;--gold:#ffd36c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at top,#214a78 0%,#0b1220 48%,#070d17 100%);color:var(--text)}body{min-height:100vh;display:grid;place-items:center;padding:clamp(10px,3vw,26px)}
    .app{width:min(100%,960px);min-height:min(92vh,880px);background:rgba(17,27,40,.97);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 80px #0006;position:relative;overflow:hidden;isolation:isolate}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 22px;border-bottom:1px solid #ffffff0f;background:#101c2de8}.brand{display:flex;align-items:center;gap:12px}.logo-mark{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#5fe4ff2e,#72a7ff1f);border:1px solid #5fe4ff59}.logo-mark svg{width:34px;height:34px}.brand h1{margin:0;font-size:clamp(1.3rem,3vw,2rem);letter-spacing:.08em}.tag{padding:7px 10px;border-radius:999px;border:1px solid #ffffff14;background:#ffffff08;color:var(--muted);font-size:.75rem;white-space:nowrap}.screen{display:none;padding:clamp(16px,3vw,30px)}.screen.active{display:block}.hero{text-align:center;padding:10px}.eyebrow{margin:0 0 10px;color:var(--cyan);letter-spacing:.16em;font-weight:800;font-size:.72rem}.hero h2{margin:0;font-size:clamp(2rem,5vw,4rem);line-height:.98;letter-spacing:-.05em}.hero h2 span{color:var(--gold)}.hero p{margin:18px auto 0;max-width:620px;font-size:1.02rem;line-height:1.6;color:var(--muted)}.category-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}.btn{appearance:none;border:1px solid #c8dcff1f;background:#ffffff08;color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;transition:120ms ease;touch-action:manipulation}.btn:hover{transform:translateY(-1px)}.btn.selected{background:linear-gradient(180deg,#72a7ff40,#5fe4ff1f);border-color:#5fe4ff66}.primary{display:inline-flex;align-items:center;justify-content:center;min-width:180px;padding:14px 22px;margin-top:26px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#06131f;font-weight:900;letter-spacing:.04em;cursor:pointer}.center-button{display:flex;justify-content:center;margin-top:20px}.stats{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;color:var(--muted);font-size:.95rem;font-weight:700}.track{height:12px;background:#ffffff10;border-radius:999px;overflow:hidden;border:1px solid #ffffff14;margin-bottom:18px}.bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--cyan),var(--blue));transition:width 200ms ease}.question{margin:0 0 18px;font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.35}.answers{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.answer{width:100%;min-height:68px;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid #ffffff14;background:#ffffff08;color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;line-height:1.4}.answer:hover:not(:disabled){border-color:#5fe4ff59;background:#5fe4ff0f}.answer.correct{background:#53d7a333;border-color:#53d7a3cc}.answer.wrong{background:#ff7a7a2e;border-color:#ff7a7ab3}.answer:disabled{cursor:default}.feedback{min-height:28px;margin:18px 0 0;font-weight:800;line-height:1.5}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}.result{margin:20px 0;padding:20px;border-radius:18px;background:#ffffff08;border:1px solid #ffffff14;font-size:1.05rem;line-height:1.7}.level{margin:14px 0;padding:16px 18px;border-radius:16px;background:linear-gradient(120deg,#72a7ff21,#5fe4ff14);border:1px solid #5fe4ff42}.level strong{color:var(--gold);font-size:1.25rem}.scoreboard{margin-top:12px;width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden}.scoreboard th,.scoreboard td{border:1px solid #ffffff14;padding:10px 12px;text-align:left}.scoreboard th{background:#ffffff08}.scoreboard td:nth-child(2){text-align:right;font-weight:800}.pool-note{text-align:center;color:var(--muted);font-size:.85rem;margin:16px 0 0}
    .celebration{position:fixed;inset:0;z-index:20;overflow:hidden;pointer-events:none}.burst{position:absolute;left:50%;top:50%;width:0;height:0}.burst-item{position:absolute;left:0;top:0;width:42px;height:42px;display:grid;place-items:center;animation:explode 1.15s cubic-bezier(.12,.7,.25,1) forwards;filter:drop-shadow(0 5px 10px #0008)}.burst-item svg{width:100%;height:100%}.burst-item.confetti-bit{width:10px;height:16px;border-radius:3px;background:var(--bit);animation-name:explodeBit}.burst-item.confetti-bit:after{content:"";position:absolute;inset:0;background:inherit;border-radius:inherit;animation:spin 1.1s linear infinite}@keyframes explode{0%{transform:translate(-50%,-50%) scale(.25);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.8);opacity:0}}@keyframes explodeBit{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot));opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:700px){.header{padding:14px 16px}.answers{grid-template-columns:1fr}.controls{flex-direction:column;align-items:stretch}.controls .btn,.controls .primary{width:100%}.app{min-height:92vh}}
  </style>

<body>
<main class="app">
  <header class="header"><div class="brand"><div class="logo-mark" aria-hidden="true"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path d="M8 53V27l24-17 24 17v26H41V39H23v14z" fill="#72a7ff"/><path d="M19 30h26v5H19zm8-8h10v5H27z" fill="#5fe4ff"/><path d="M27 53V40h10v13" fill="#ffd36c"/><path d="M5 56h54" stroke="#5fe4ff" stroke-width="4" stroke-linecap="round"/></svg></div><h1>KALECAD</h1></div><span class="tag">AutoCAD • SketchUp</span></header>
  <section id="home" class="screen active"><div class="hero"><p class="eyebrow">⚡ ÇİZİM BİLGİNİ TEST ET</p><h2>Komutları biliyor<br><span>musun?</span></h2><p>AutoCAD ve SketchUp bilginle 20 soruluk turlara katıl. Her turda havuzdan daha önce sorulmamış sorular seçilir.</p></div><div class="category-row" aria-label="Kategori seçimi"><button class="btn selected" data-cat="all" type="button">Karışık</button><button class="btn" data-cat="AutoCAD" type="button">AutoCAD</button><button class="btn" data-cat="SketchUp" type="button">SketchUp</button></div><p class="pool-note" id="poolNote"></p><div class="center-button"><button class="primary" id="start" type="button">Başla</button></div></section>
  <section id="quiz" class="screen"><div class="stats"><span id="q-count"></span><span id="score">Puan: 0</span></div><div class="track"><div class="bar" id="bar"></div></div><h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="controls"><button class="btn primary hidden" id="next" type="button">Sonraki soru</button><button class="btn" data-home type="button">Ana menü</button></div></section>
  <section id="result" class="screen"><h2>🏁 Tur tamamlandı!</h2><div class="level" id="levelText"></div><div class="result" id="resultText"></div><table class="scoreboard" aria-label="Skor tablosu"><thead><tr><th>Gösterge</th><th>Sonuç</th></tr></thead><tbody><tr><td>Doğru cevap</td><td id="correctCount">0</td></tr><tr><td>Yanlış cevap</td><td id="wrongCount">0</td></tr><tr><td>Başarı</td><td id="accuracy">0%</td></tr><tr><td>Rekor (doğru)</td><td id="bestStat">0</td></tr></tbody></table><div class="center-button"><button class="primary" id="replay" type="button">Yeni tur oyna</button></div><div class="center-button"><button class="btn" data-home type="button">Ana menü</button></div></section>
</main><div class="celebration" id="celebration" aria-hidden="true"></div>
<script>
// Her konu 4 farklı soru biçimi üretir: 50 konu × 4 = 200 farklı soru.
const facts={
  AutoCAD:[
    ['LINE','İki veya daha fazla nokta arasında düz çizgi çizer.'],['PLINE','Birbirine bağlı çizgi ve yay parçalarından tek bir çoklu çizgi oluşturur.'],['CIRCLE','Merkezi ve yarıçapı/çapı belirlenen daire çizer.'],['ARC','Bir dairenin yalnızca bir bölümünü, yani yayı çizer.'],['RECTANG','Dikdörtgen biçiminde kapalı bir çoklu çizgi oluşturur.'],['POLYGON','Eşit kenarlı kapalı çokgen çizer.'],['MOVE','Seçili nesneleri belirlenen konuma taşır.'],['COPY','Seçili nesnelerin bir veya daha fazla kopyasını oluşturur.'],['ROTATE','Seçili nesneleri bir taban noktası çevresinde döndürür.'],['MIRROR','Seçili nesnelerin belirlenen eksene göre simetriğini oluşturur.'],['SCALE','Seçili nesneleri taban noktasına göre büyütür veya küçültür.'],['OFFSET','Bir nesneye belirli mesafede paralel veya eş merkezli kopya oluşturur.'],['TRIM','Nesneleri belirlenen kesme sınırlarında kırpar.'],['EXTEND','Nesneleri seçilen sınır nesnesine kadar uzatır.'],['FILLET','İki nesne arasına yarıçaplı yuvarlak bir köşe ekler.'],['CHAMFER','İki nesnenin köşesini eğimli bir kenarla birleştirir.'],['ARRAY','Nesnelerin düzenli dikdörtgensel, dairesel veya yol boyunca kopyalarını oluşturur.'],['HATCH','Kapalı bir alanı tarama deseni veya dolgu ile doldurur.'],['ERASE','Seçili nesneleri çizimden siler.'],['EXPLODE','Birleşik nesneyi bileşen parçalarına ayırır.'],['JOIN','Uç uca gelen uyumlu nesneleri tek nesnede birleştirir.'],['STRETCH','Seçilen alan içindeki noktaları taşıyarak nesneleri uzatır veya kısaltır.'],['MALIGN','Nesneleri iki nokta çifti kullanarak hizalar ve isteğe bağlı ölçekler.'],['DIM','Çizime doğrusal, açısal ve diğer ölçü açıklamalarını ekler.'],['DIST','İki nokta arasındaki mesafeyi ve açı bilgisini ölçer.'],['AREA','Kapalı bir alanın alanını ve çevresini hesaplar.'],['LAYER','Çizim katmanlarını oluşturur ve özelliklerini yönetir.'],['BLOCK','Seçili nesneleri tekrar kullanılabilir blok tanımına dönüştürür.'],['XREF','Başka bir çizimi dış referans olarak mevcut çizime bağlar.'],['ZOOM','Çizim görünümünün yakınlık düzeyini değiştirir.'],['PAN','Çizim görünümünü kaydırır; nesnelerin konumunu değiştirmez.'],['UCS','Kullanıcı koordinat sisteminin yönünü ve başlangıç noktasını ayarlar.'],['OSNAP','Nokta, merkez ve kesişim gibi hassas geometrik noktalara yakalar.'],['ORTHO','İmleç hareketini yatay ve dikey yönlerle sınırlar.'],['POLAR','İmleci ayarlanan açılarda izleyerek çizim yapmayı kolaylaştırır.'],['OFFSETDIST','OFFSET komutu için kullanılacak mesafe değerini belirler.'],['MATCHPROP','Bir nesnenin özelliklerini diğer seçili nesnelere aktarır.'],['PROPERTIES','Seçili nesnelerin özelliklerini görüntüler ve düzenler.'],['TEXT','Tek satırlı yazı ekler.'],['MTEXT','Birden çok satır ve biçimlendirme içeren metin bloğu ekler.'],['LEADER','Açıklama metnine bağlı yönlendirici çizgi oluşturur.'],['DIMSTYLE','Ölçülerin görünüşünü ve biçim kurallarını yönetir.'],['LTSCALE','Çizimdeki kesik çizgi desenlerinin genel ölçeğini ayarlar.'],['REGEN','Ekran görüntüsünü yeniden hesaplayıp çizimi tazeler.'],['PURGE','Kullanılmayan adlandırılmış tanımları çizimden temizler.'],['BOUNDARY','Kapalı alanın sınırından kapalı çoklu çizgi veya bölge oluşturur.'],['BREAK','Bir nesnenin iki nokta arasındaki bölümünü kaldırır veya ayırır.'],['ALIGN','Nesneleri kaynak ve hedef noktalarına göre hizalar.'],['REVOLVE','2B profilini bir eksen etrafında döndürerek 3B katı/yüzey oluşturur.'],['EXTRUDE','Kapalı profil veya yüzeyi bir yönde uzatarak 3B nesne oluşturur.']
  ],
  SketchUp:[
    ['Select','Modeldeki kenar, yüzey, grup veya bileşenleri seçer.'],['Line','Noktaları birleştirerek kenarlar ve yüzey sınırları çizer.'],['Rectangle','Dört kenarlı dikdörtgen yüzey oluşturur.'],['Circle','Merkez ve yarıçapla dairesel yüzey/kenar oluşturur.'],['Arc','Düzlem üzerinde yay biçimli kenar çizer.'],['Polygon','Düzenli çokgen biçimli yüzey ve kenar oluşturur.'],['Push/Pull','Bir yüzeyi itip çekerek 3B hacim veya girinti oluşturur.'],['Move','Geometriyi taşır; kopyalama için Ctrl/Option ile kullanılabilir.'],['Rotate','Geometriyi belirlenen merkez ve eksen etrafında döndürür.'],['Scale','Seçilen geometriyi tutamaçlarla büyütür veya küçültür.'],['Offset','Bir yüzeyin kenarlarından eşit uzaklıklı iç/dış çevre oluşturur.'],['Eraser','Kenarları siler; yumuşatma ve gizleme işlemlerinde de kullanılır.'],['Paint Bucket','Yüzeylere renk, malzeme veya doku uygular.'],['Orbit','Modelin etrafında kamerayı döndürerek farklı açılardan bakar.'],['Pan','Görünümü yatay/dikey kaydırır; kameranın bakış açısını döndürmez.'],['Zoom','Kamerayı yakınlaştırır veya uzaklaştırır.'],['Tape Measure','Mesafeleri ölçer ve kılavuz çizgiler oluşturur.'],['Protractor','Açıları ölçer ve açılı kılavuzlar oluşturur.'],['Follow Me','Bir profili seçilen yol boyunca süpürerek 3B biçim oluşturur.'],['2 Point Arc','Başlangıç ve bitiş noktalarıyla, yay yüksekliğini belirleyerek yay çizer.'],['3D Text','Model içine kabartmalı veya oyuk üç boyutlu yazı ekler.'],['Section Plane','Modeli incelemek için kesit düzlemi oluşturur.'],['Make Group','Seçili geometriyi gruplayarak diğer geometriyle yapışmasını önler.'],['Make Component','Geometriyi tekrar kullanılabilir ve eş örnekleri güncellenebilir bileşene dönüştürür.'],['Explode','Grup veya bileşeni açarak içindeki geometriyi düzenlemeye hazırlar.'],['Intersect Faces','Kesişen geometrilerden yeni kenar ve yüzey sınırları üretir.'],['Soften/Smooth Edges','Kenarları yumuşatır veya gizleyerek yüzeylerin daha pürüzsüz görünmesini sağlar.'],['Axes','Modelin kırmızı, yeşil ve mavi eksenlerini taşır veya yönlendirir.'],['Zoom Extents','Modeldeki tüm geometri ekrana sığacak şekilde yakınlaştırır.'],['Hide','Seçili geometriyi geçici olarak görünmez yapar.'],['Unhide','Daha önce gizlenmiş geometriyi yeniden görünür yapar.'],['Lock','Seçili grubu veya bileşeni yanlışlıkla düzenlenmeye karşı kilitler.'],['Flip Along','Seçili geometriyi belirlenen eksen doğrultusunda aynalar.'],['Outer Shell','İki katı grubun dış kabuğunu tek bir katı biçimde birleştirir.'],['Solid Tools: Union','Katı grupların hacimlerini birleştirerek tek katı oluşturur.'],['Solid Tools: Subtract','Bir katıdan diğerinin kapladığı hacmi çıkarır.'],['Solid Tools: Trim','Bir katıyı diğer katının sınırlarına göre keser.'],['Position Camera','Kamerayı modelde seçilen noktaya yerleştirip bakış yönünü ayarlar.'],['Look Around','Kamerayı bulunduğu noktadan çevreye bakacak şekilde döndürür.'],['Walk','Model içinde yürüyüş benzeri kamera hareketi sağlar.'],['Match Photo','Fotoğraf perspektif çizgileriyle model görünümünü eşleştirmeye yardımcı olur.'],['Outliner','Modeldeki grupları ve bileşenleri hiyerarşik listede yönetir.'],['Tags','Model geometrisini etiketlerle düzenleyip görünürlüğünü kontrol eder.'],['Scenes','Kamera, görünürlük ve stil durumlarını kaydedip sunum görünümü oluşturur.'],['Shadows','Güneş ve saat/tarih ayarlarına göre model gölgelerini gösterir.'],['Styles','Kenar, yüzey ve arka plan görünümünü belirleyen görsel stili yönetir.'],['Model Info','Birim, hassasiyet ve model bilgisi ayarlarını yönetir.'],['Entity Info','Seçili nesnenin türü, ölçüleri ve atanmış özelliklerini gösterir.'],['Extension Warehouse','SketchUp’a eklenti bulup kurmak için kullanılan eklenti kataloğudur.'],['Dimension','Modeldeki kenar veya noktalar arasına ölçü açıklaması ekler.']
  ]
};
const templates=[(tool)=>`${tool} aracı/komutu ne işe yarar?`,(tool)=>`Bir model veya çizimde ${tool} kullanarak hangi işlemi yaparsın?`,(tool)=>`${tool} seçeneğinin temel görevi nedir?`,(tool)=>`${tool} aracını hangi amaçla kullanırsın?`];
const pool=[];
for(const [category,items] of Object.entries(facts)){
  items.forEach((item,index)=>{
    const [tool,purpose]=item;
    for(let v=0;v<4;v++){
      const askTool=v>=2;
      const distractors=askTool?items.filter((_,i)=>i!==index).map(x=>x[0]):items.filter((_,i)=>i!==index).map(x=>x[1]);
      const answer=askTool?tool:purpose;
      const question=askTool?`${purpose} işlemi için ${category}’te hangi araç/komut kullanılır?`:templates[v](tool);
      pool.push({category,question,answer,options:[answer,...shuffle(distractors).slice(0,3)]});
    }
  });
}
function shuffle(array){const out=[...array];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
let category='all',list=[],index=0,points=0,locked=false;
const screens=[...document.querySelectorAll('.screen')],scoreLabel=document.getElementById('score'),questionLabel=document.getElementById('question'),answersWrap=document.getElementById('answers'),feedback=document.getElementById('feedback'),nextBtn=document.getElementById('next'),bar=document.getElementById('bar'),qCount=document.getElementById('q-count');
function showScreen(id){screens.forEach(screen=>screen.classList.toggle('active',screen.id===id))}
function storageKey(cat){return `kalecad-seen-v3-${cat}`}
function getRemaining(cat){try{const seen=new Set(JSON.parse(localStorage.getItem(storageKey(cat))||'[]'));return pool.filter(q=>(cat==='all'||q.category===cat)&&!seen.has(q.question))}catch{return pool.filter(q=>cat==='all'||q.category===cat)}}
function setCategory(cat){category=cat;document.querySelectorAll('[data-cat]').forEach(btn=>btn.classList.toggle('selected',btn.dataset.cat===cat));const available=getRemaining(cat).length;document.getElementById('poolNote').textContent=`${pool.length} farklı soru • Bu seçimde ${available} soru henüz sorulmadı`}
function startQuiz(){let remaining=getRemaining(category);if(remaining.length<20){try{localStorage.removeItem(storageKey(category))}catch{}remaining=pool.filter(q=>category==='all'||q.category===category)}list=shuffle(remaining).slice(0,20);if(!list.length){alert('Bu kategoride soru bulunamadı.');return}try{const seen=new Set(JSON.parse(localStorage.getItem(storageKey(category))||'[]'));list.forEach(q=>seen.add(q.question));localStorage.setItem(storageKey(category),JSON.stringify([...seen]))}catch{}index=0;points=0;showScreen('quiz');renderQuestion()}
function renderQuestion(){locked=false;const item=list[index];qCount.textContent=`Soru ${index+1} / ${list.length}`;questionLabel.textContent=item.question;scoreLabel.textContent=`Puan: ${points}`;feedback.textContent='';feedback.className='feedback';nextBtn.classList.add('hidden');bar.style.width=`${index/list.length*100}%`;answersWrap.innerHTML='';shuffle(item.options).forEach(answer=>{const btn=document.createElement('button');btn.type='button';btn.className='answer';btn.textContent=answer;btn.addEventListener('click',()=>chooseAnswer(btn,answer,item.answer));answersWrap.appendChild(btn)})}
function logoSvg(type){return type==='cad'?'<svg viewBox="0 0 48 48" aria-label="AutoCAD"><path fill="#ef4444" d="M24 3 46 43H35L24 22 13 43H2z"/><path fill="#fff" d="M19 34h10l-5-9z"/></svg>':'<svg viewBox="0 0 48 48" aria-label="SketchUp"><path fill="#78bd43" d="M24 3 44 14v21L24 46 4 35V14z"/><path fill="#a8d776" d="m24 3 20 11-20 12L4 14z"/><path fill="#579b35" d="m24 26 20-12v21L24 46z"/><path fill="#fff" d="m15 15 9-5 9 5-9 5zm0 10 9 5 9-5v7l-9 5-9-5z" opacity=".9"/></svg>'}
function celebrate(){const layer=document.getElementById('celebration');layer.innerHTML='';const colors=['#5fe4ff','#72a7ff','#ffd36c','#53d7a3','#ff7a7a','#fff'];for(let i=0;i<30;i++){const el=document.createElement('span');el.className='burst-item confetti-bit';el.style.setProperty('--dx',`${(Math.random()-.5)*Math.min(innerWidth*.9,900)}px`);el.style.setProperty('--dy',`${(Math.random()-.5)*Math.min(innerHeight*.8,650)}px`);el.style.setProperty('--rot',`${Math.random()*800-400}deg`);el.style.setProperty('--bit',colors[i%colors.length]);el.style.animationDelay=`${Math.random()*.12}s`;layer.appendChild(el)}for(let i=0;i<10;i++){const el=document.createElement('span');el.className='burst-item';el.innerHTML=logoSvg(i%2?'sketchup':'cad');el.style.setProperty('--dx',`${(Math.random()-.5)*Math.min(innerWidth*.75,700)}px`);el.style.setProperty('--dy',`${(Math.random()-.5)*Math.min(innerHeight*.7,560)}px`);el.style.setProperty('--rot',`${Math.random()*540-270}deg`);el.style.animationDelay=`${Math.random()*.1}s`;layer.appendChild(el)}setTimeout(()=>layer.replaceChildren(),1500)}
function chooseAnswer(button,answer,correct){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(btn=>{btn.disabled=true;if(btn.textContent===correct)btn.classList.add('correct');if(btn.textContent===answer&&answer!==correct)btn.classList.add('wrong')});if(answer===correct){points++;feedback.textContent='✅ Doğru!';feedback.classList.add('good');celebrate()}else{feedback.textContent=`❌ Yanlış! Doğru cevap: ${correct}`;feedback.classList.add('bad')}scoreLabel.textContent=`Puan: ${points}`;nextBtn.classList.remove('hidden')}
function finishRound(){const total=list.length,pct=Math.round(points/total*100);const bestKey='kalecad-best-v3';let best=0;try{best=Number(localStorage.getItem(bestKey)||0);best=Math.max(best,points);localStorage.setItem(bestKey,String(best))}catch{best=points}document.getElementById('correctCount').textContent=String(points);document.getElementById('wrongCount').textContent=String(total-points);document.getElementById('accuracy').textContent=`${pct}%`;document.getElementById('bestStat').textContent=String(best);let title,detail;if(pct>=80){title='Uzman';detail='CAD bilgin çok güçlü — böyle devam et!'}else if(pct>=50){title='Orta seviye';detail='İyi gidiyorsun; biraz daha pratikle uzmanlığa ulaşabilirsin.'}else{title='Kendini geliştirmelisin';detail='Yeni bir turla pratik yap, her turda yeni sorular seni bekliyor.'}document.getElementById('levelText').innerHTML=`<strong>${title}</strong><br>${detail}`;document.getElementById('resultText').innerHTML=`Bu turda <strong>${points} / ${total}</strong> doğru cevap verdin. Başarı oranı: <strong>${pct}%</strong>.`;bar.style.width='100%';showScreen('result');setCategory(category)}
document.getElementById('start').addEventListener('click',startQuiz);document.getElementById('replay').addEventListener('click',startQuiz);nextBtn.addEventListener('click',()=>{if(index+1<list.length){index++;renderQuestion()}else finishRound()});document.querySelectorAll('[data-home]').forEach(btn=>btn.addEventListener('click',()=>{showScreen('home');setCategory(category)}));document.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>setCategory(btn.dataset.cat)));setCategory('all');
</script>
</body>
</html>
