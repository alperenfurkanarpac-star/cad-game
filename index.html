<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>CAD Oyun Merkezi</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#192437;--card:#223149;--line:#354762;--text:#f2f6ff;--muted:#bdc9dc;--blue:#72a7ff;--cyan:#53d5e8;--green:#43d69a;--red:#ff7777}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:clamp(10px,3vw,28px);display:grid;place-items:center;background:radial-gradient(ellipse at top,#243956,var(--bg) 62%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
    button{font:inherit;color:inherit;touch-action:manipulation}.app{width:min(100%,960px);overflow:hidden;background:rgba(22,33,51,.97);border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 65px #0007}.header{padding:16px clamp(16px,4vw,28px);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#121d2e}.header h1{font-size:clamp(1.2rem,4vw,1.8rem);margin:0}.tag{font-size:.75rem;font-weight:800;letter-spacing:.06em;color:#081321;background:linear-gradient(100deg,var(--blue),var(--cyan));padding:8px 12px;border-radius:99px;white-space:nowrap}.screen{display:none;padding:clamp(16px,4vw,30px)}.screen.active{display:block}.lead{color:var(--muted);line-height:1.6;margin:0 0 20px}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{min-height:150px;padding:22px;background:linear-gradient(145deg,#243550,#1b273b);border:1px solid var(--line);border-radius:16px;text-align:left;cursor:pointer}.tile:hover,.tile:focus-visible{border-color:var(--blue)}.tile b{display:block;font-size:1.25rem;margin:9px 0}.tile span{color:var(--muted);line-height:1.5}.icon{font-size:1.8rem}.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--blue);background:#2b3c58}.primary{width:100%;margin-top:16px;border:0;color:#091322;background:linear-gradient(100deg,var(--blue),var(--cyan));font-weight:850}.back{width:100%;margin-top:14px;background:transparent}.categories{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.categories .btn{flex:1;min-width:100px}.selected{border-color:var(--blue);background:#2b4263}.stats{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.95rem;margin-bottom:12px}.track{height:8px;border-radius:20px;background:#29364b;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s}.question{font-size:clamp(1.15rem,3.8vw,1.7rem);line-height:1.4;margin:22px 0 16px}.answers{display:grid;gap:10px}.answer{text-align:left}.answer.correct{border-color:var(--green);background:#163d34}.answer.wrong{border-color:var(--red);background:#452a35}.answer:disabled{opacity:1}.feedback{min-height:26px;font-weight:700;margin:14px 0 0}.good{color:var(--green)}.bad{color:var(--red)}.result{text-align:center;padding:18px;background:#202e44;border-radius:16px;color:var(--muted)}.result strong{display:block;color:white;font-size:2rem;margin-bottom:8px}.pong-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:var(--muted);font-weight:750}.canvas-wrap{width:100%;position:relative;touch-action:none}.canvas-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:900/500;border:1px solid var(--line);border-radius:14px;background:#0b1220;touch-action:none}.help{text-align:center;color:var(--muted);line-height:1.5;font-size:.92rem;margin:12px 0}.touch-controls{display:none;grid-template-columns:1fr 1fr;gap:12px}.touch-controls button{min-height:58px;font-size:1.3rem;user-select:none;-webkit-user-select:none;touch-action:none}.hidden{display:none!important}
    @media(max-width:600px){body{padding:8px;display:block}.app{margin:8px auto;border-radius:16px}.header{padding:13px 15px}.screen{padding:16px}.menu-grid{grid-template-columns:1fr}.tile{min-height:auto;padding:17px}.touch-controls{display:grid}.pong-top{font-size:.88rem}.categories{gap:7px}.categories .btn{padding:11px 9px}}
  </style>
</head>
<body>
<main class="app">
  <header class="header"><h1>CAD Oyun Merkezi</h1><span class="tag">AutoCAD • SketchUp</span></header>
  <section id="home" class="screen active">
    <p class="lead">Telefon, tablet ve akıllı tahta için uyumlu oyunlar. Birini seçerek başlayın.</p>
    <div class="menu-grid">
      <button class="tile" id="openQuiz"><span class="icon">🧠</span><b>Komut Bilgi Yarışması</b><span>AutoCAD ve SketchUp komutlarını öğren, puanını gör.</span></button>
      <button class="tile" id="openPong"><span class="icon">🏓</span><b>Pong Oyunu</b><span>Sol raketi fare, dokunmatik ekran veya ↑ / ↓ ile kontrol et.</span></button>
    </div>
  </section>
  <section id="quiz" class="screen">
    <div class="stats"><span id="qCount"></span><span id="score">Puan: 0</span></div><div class="track"><div class="bar" id="bar"></div></div>
    <div class="categories"><button class="btn selected" data-cat="all">Karışık</button><button class="btn" data-cat="AutoCAD">AutoCAD</button><button class="btn" data-cat="SketchUp">SketchUp</button></div>
    <h2 class="question" id="question"></h2><div class="answers" id="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p>
    <button class="btn primary hidden" id="next">Sonraki soru</button><button class="btn back" data-home>Ana menü</button>
  </section>
  <section id="result" class="screen"><h2>Yarışma tamamlandı</h2><div class="result" id="resultText"></div><button class="btn primary" id="replay">Tekrar oyna</button><button class="btn back" data-home>Ana menü</button></section>
  <section id="pong" class="screen">
    <div class="pong-top"><span id="playerScore">Oyuncu: 0</span><span id="computerScore">Bilgisayar: 0</span></div>
    <div class="canvas-wrap"><canvas id="game" width="900" height="500" aria-label="Pong oyun alanı"></canvas></div>
    <p class="help">Sol raketi fareyle hareket ettirin veya ekrana dokunup sürükleyin. Klavyede ↑ / ↓ tuşlarını da kullanabilirsiniz.</p>
    <div class="touch-controls"><button class="btn" id="up" aria-label="Raketi yukarı taşı">▲</button><button class="btn" id="down" aria-label="Raketi aşağı taşı">▼</button></div>
    <button class="btn back" data-home id="pongHome">Ana menü</button>
  </section>
</main>
<script>
const Q=[
 {c:'AutoCAD',q:'AutoCAD’de çizgi çizmek için kullanılan temel komut hangisidir?',a:['LINE','TRIM','OFFSET','FILLET'],x:'LINE'},
 {c:'AutoCAD',q:'Bir nesnenin kopyasını oluşturmak için hangi komut kullanılır?',a:['MOVE','COPY','ARRAY','ROTATE'],x:'COPY'},
 {c:'AutoCAD',q:'Fazla çizgi parçalarını kesmek için hangi komut kullanılır?',a:['TRIM','EXTEND','JOIN','BREAK'],x:'TRIM'},
 {c:'AutoCAD',q:'Daire çizmek için kullanılan komut hangisidir?',a:['CIRCLE','ARC','ELLIPSE','POLYGON'],x:'CIRCLE'},
 {c:'AutoCAD',q:'Nesneyi başka bir konuma taşımak için hangi komut kullanılır?',a:['MOVE','COPY','SCALE','ERASE'],x:'MOVE'},
 {c:'AutoCAD',q:'Nesneyi aynalamak için hangi komut kullanılır?',a:['MIRROR','OFFSET','ALIGN','STRETCH'],x:'MIRROR'},
 {c:'SketchUp',q:'Bir yüzeyi 3 boyutlu hale getirmek için hangi araç kullanılır?',a:['Push/Pull','Orbit','Paint Bucket','Eraser'],x:'Push/Pull'},
 {c:'SketchUp',q:'Modeli farklı açılardan incelemek için kullanılan araç hangisidir?',a:['Orbit','Line','Move','Scale'],x:'Orbit'},
 {c:'SketchUp',q:'SketchUp’ta dikdörtgen aracının varsayılan kısayolu hangisidir?',a:['R','L','M','P'],x:'R'},
 {c:'SketchUp',q:'Yüzeye renk veya malzeme uygulamak için hangi araç kullanılır?',a:['Paint Bucket','Select','Arc','Rotate'],x:'Paint Bucket'},
 {c:'SketchUp',q:'Bir nesneyi taşımak için hangi araç kullanılır?',a:['Move','Offset','Push/Pull','Zoom'],x:'Move'},
 {c:'SketchUp',q:'Çizgi çizmek için kullanılan araç hangisidir?',a:['Line','Circle','Rectangle','Orbit'],x:'Line'}
];
let category='all', list=[], index=0, points=0, locked=false;
const screens=[...document.querySelectorAll('.screen')];function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));if(id!=='pong')stopGame()}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('selected',x===b))});
document.getElementById('openQuiz').onclick=()=>startQuiz();document.getElementById('openPong').onclick=()=>{show('pong');startGame()};
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('home'));
function startQuiz(){list=shuffled(category==='all'?Q:Q.filter(q=>q.c===category));index=0;points=0;show('quiz');render()}
function render(){locked=false;const item=list[index];document.getElementById('qCount').textContent=`Soru ${index+1} / ${list.length} • ${item.c}`;document.getElementById('score').textContent=`Puan: ${points}`;document.getElementById('bar').style.width=`${index/list.length*100}%`;document.getElementById('question').textContent=item.q;const fb=document.getElementById('feedback');fb.textContent='';fb.className='feedback';const next=document.getElementById('next');next.classList.add('hidden');const box=document.getElementById('answers');box.replaceChildren();shuffled(item.a).forEach(answer=>{const b=document.createElement('button');b.className='btn answer';b.textContent=answer;b.onclick=()=>choose(b,answer,item.x);box.append(b)})}
function choose(btn,answer,correct){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct')});const fb=document.getElementById('feedback');if(answer===correct){points++;fb.textContent='Doğru cevap!';fb.classList.add('good')}else{btn.classList.add('wrong');fb.textContent=`Yanlış. Doğru cevap: ${correct}`;fb.classList.add('bad')}document.getElementById('score').textContent=`Puan: ${points}`;const next=document.getElementById('next');next.textContent=index===list.length-1?'Sonucu gör':'Sonraki soru';next.classList.remove('hidden')}
document.getElementById('next').onclick=()=>{if(++index<list.length)render();else{show('result');const r=points/list.length;document.getElementById('resultText').innerHTML=`<strong>${points} / ${list.length} doğru</strong>${r===1?'Harika! Hepsini doğru bildin.':r>=.7?'Çok iyi!':r>=.4?'İyi gidiyorsun, devam et!':'Bir tur daha oynayıp bilgini pekiştir.'}`}};
document.getElementById('replay').onclick=startQuiz;
// Pong: canvas coordinate system stays 900x500; pointer position is scaled for any display size.
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const W=900,H=500;
const left={x:22,y:195,w:16,h:110},right={x:862,y:195,w:16,h:110},ball={x:450,y:250,r:10,vx:5,vy:2.5};let ps=0,cs=0,frame=0,keys={};
function resetBall(){ball.x=W/2;ball.y=H/2;ball.vx=(Math.random()<.5?-1:1)*5;ball.vy=(Math.random()*2-1)*3.5}
function scores(){document.getElementById('playerScore').textContent=`Oyuncu: ${ps}`;document.getElementById('computerScore').textContent=`Bilgisayar: ${cs}`}
function startGame(){stopGame();ps=0;cs=0;left.y=right.y=(H-left.h)/2;scores();resetBall();frame=requestAnimationFrame(loop)}
function stopGame(){if(frame)cancelAnimationFrame(frame);frame=0}
function clampPaddles(){left.y=Math.max(0,Math.min(H-left.h,left.y));right.y=Math.max(0,Math.min(H-right.h,right.y))}
function update(){if(keys.ArrowUp)left.y-=8;if(keys.ArrowDown)left.y+=8;left.y=Math.max(0,Math.min(H-left.h,left.y));const target=ball.y-right.h/2;if(right.y+right.h/2<target-18)right.y+=5.2;else if(right.y+right.h/2>target+18)right.y-=5.2;right.y=Math.max(0,Math.min(H-right.h,right.y));ball.x+=ball.vx;ball.y+=ball.vy;
 if(ball.y-ball.r<0||ball.y+ball.r>H)ball.vy*=-1;
 if(ball.vx<0&&ball.x-ball.r<=left.x+left.w&&ball.x>left.x&&ball.y+ball.r>=left.y&&ball.y-ball.r<=left.y+left.h){ball.x=left.x+left.w+ball.r;const offset=(ball.y-(left.y+left.h/2))/(left.h/2);ball.vx=Math.min(Math.abs(ball.vx)+.25,10);ball.vy=offset*6}
 if(ball.vx>0&&ball.x+ball.r>=right.x&&ball.x<right.x+right.w&&ball.y+ball.r>=right.y&&ball.y-ball.r<=right.y+right.h){ball.x=right.x-ball.r;const offset=(ball.y-(right.y+right.h/2))/(right.h/2);ball.vx=-Math.min(Math.abs(ball.vx)+.25,10);ball.vy=offset*6}
 if(ball.x<0){cs++;scores();resetBall()}if(ball.x>W){ps++;scores();resetBall()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(180,200,230,.32)';for(let y=10;y<H;y+=30)ctx.fillRect(W/2-2,y,4,16);ctx.fillStyle='#72a7ff';ctx.fillRect(left.x,left.y,left.w,left.h);ctx.fillStyle='#53d5e8';ctx.fillRect(right.x,right.y,right.w,right.h);ctx.beginPath();ctx.fillStyle='#fff';ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill()}
function loop(){if(!document.getElementById('pong').classList.contains('active')){stopGame();return}update();draw();frame=requestAnimationFrame(loop)}
function movePaddle(e){const rect=canvas.getBoundingClientRect();const y=(e.clientY-rect.top)*H/rect.height;left.y=y-left.h/2;clampPaddles()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);movePaddle(e)});canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure>0)movePaddle(e)});
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();keys[e.key]=true}});document.addEventListener('keyup',e=>{keys[e.key]=false});
function bindHold(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();keys[key]=true};const off=()=>keys[key]=false;el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off)}bindHold('up','ArrowUp');bindHold('down','ArrowDown');
</script>
</body>
</html>
